[package]
name = "veilops-verifier"
version = "0.2.0"
description = "On-chain verifier for VEILOPS veilops-range-v2 zero-knowledge range proofs (experimental, not audited)"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "veilops_verifier"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = "=1.1.2"
solana-curve25519 = "=4.0.1"
solana-sha256-hasher = "=3.1.0"
curve25519-dalek = { version = "=4.1.3", default-features = false }
