name: Bug report
description: Something in VEILOPS does not behave as documented. Not for security vulnerabilities.
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **If this is a security vulnerability** (a forged proof that verifies, leaked plaintext, an envelope opened without a key, etc.), do not file it here: use the private reporting link on the previous page.
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - "@veilops/sdk"
        - "@veilops/proof-engine"
        - "@veilops/encryption"
        - "@veilops/policy-engine"
        - "@veilops/solana-adapter"
        - "@veilops/shared"
        - apps/website
        - docs
        - CI / tooling
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal script or vitest test is ideal. Do not paste real secret keys, seeds or personal data.
      render: ts
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit hash
      placeholder: "git rev-parse HEAD"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Node 22.x, macOS 15 / Chrome 131, ..."
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This is not a security vulnerability.
          required: true
        - label: I searched existing issues.
          required: true
