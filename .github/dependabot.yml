version: 2
updates:
  # Minor and patch updates are grouped into one weekly PR. Major upgrades (Tailwind 4, TypeScript 7,
  # ESLint 10, framer-motion 14, …) change APIs and are planned by hand, so Dependabot does not open them.
  # Security updates are not affected by this rule: GitHub still opens those for any version.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      noble:
        patterns: ['@noble/*']
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
