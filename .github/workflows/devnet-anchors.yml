name: Devnet anchors

# Also re-checks the on-chain verifier results: Records owned by the program, proof bytes matching proof_hash,
# off-chain re-verification of the on-chain proofs, and the cheating attempts failing with no Record.

# Re-checks every published Solana devnet anchor against a public RPC: the memo must match the
# published record, the transaction must be signed by the published key, and the record must verify.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/website/data/devnet-anchors.json', 'apps/website/data/onchain-verifications.json', 'scripts/devnet-verify.ts', 'scripts/onchain-check.ts']

permissions:
  contents: read

jobs:
  verify:
    name: Verify devnet anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/devnet-verify.ts
      - name: On-chain verifier results
        run: npx tsx scripts/onchain-check.ts
